[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "firedataforge"
dynamic = ["version"]
description = "FireDataForge turns one MTBS fire ID into a stack of harmonized, analysis-ready geospatial layers (perimeters, FRP, terrain, fuels, weather, and more) from many sources."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Zeyu Xia", email = "zeyu.xia@virginia.edu" },
]
keywords = [
    "wildfire",
    "geospatial",
    "remote-sensing",
    "mtbs",
    "feds",
    "earth-engine",
    "raster",
    "dataset",
    "machine-learning",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "affine",
    "earthengine-api",
    "geemap",
    "geopandas[all]",
    "herbie-data[extras]",
    "questionary",
    "rasterio",
    "rioxarray",
    "scipy",
    "tqdm",
]

[project.optional-dependencies]
examples = [
    "matplotlib",
]

[project.scripts]
firedataforge = "firedataforge.cli:main"

[project.urls]
Homepage = "https://github.com/xiazeyu/FireDataForge"
Repository = "https://github.com/xiazeyu/FireDataForge"
Issues = "https://github.com/xiazeyu/FireDataForge/issues"

[dependency-groups]
dev = [
    "ipykernel",
    "matplotlib",
    "pandas-stubs",
    "types-shapely",
    "types-tqdm",
    "scipy-stubs",
]

[tool.hatch.version]
path = "firedataforge/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["firedataforge"]

[tool.hatch.build.targets.sdist]
include = [
    "/firedataforge",
    "/README.md",
    "/LICENSE",
    "/CITATION.cff",
]
